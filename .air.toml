root = "."
tmp_dir = "tmp"

[build]
  cmd = "go build -buildvcs=false -o ./tmp/server ./cmd/server"
  bin = "./tmp/server"
  args_bin = ["--config-dir", "./config-dev", "--staging-dir", "./staging-dev"]
  include_ext = ["go"]
  include_dir = ["cmd", "internal"]
  exclude_dir = ["web", "docs", "vendor", "tmp"]
  delay = 1000

[log]
  time = false

[misc]
  clean_on_exit = true
